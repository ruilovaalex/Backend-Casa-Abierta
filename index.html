
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Explorer - Casa Abierta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #020617; 
            color: #f1f5f9;
            scroll-behavior: smooth;
        }
        .serif { font-family: 'Playfair Display', serif; }
        
        .bg-main-gradient {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020617 100%);
        }

        .brand-title {
            font-weight: 900;
            letter-spacing: -0.05em;
        }
        .brand-accent {
            color: #6366f1;
        }

        /* Scrollbar estética */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1b4b;
            border-radius: 5px;
            border: 2px solid #020617;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #312e81;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="bg-main-gradient">
    <div id="root"></div>
</body>
</html>
